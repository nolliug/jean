<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jean Guillon – Chief Innovation Officer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Jean Guillon is Chief Innovation Officer at Vant Nexus, a leading consultant on ICANN new gTLDs, domain strategy, and innovative namespace projects." />
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --accent-contrast: #ffffff;
      --card: #f8fafc;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    header {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (min-width: 720px) {
      header {
        grid-template-columns: auto 1fr;
        align-items: center;
      }
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 36px;
      border: 4px solid var(--border);
      flex-shrink: 0;
    }
    .header-content h1 {
      margin: 0 0 4px;
      font-size: 28px;
      line-height: 1.2;
    }
    .header-content p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    .btn.primary {
      background: var(--accent);
      color: var(--accent-contrast);
      border-color: var(--accent);
    }
    section {
      margin: 28px 0;
    }
    h2 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }
    li {
      margin: 6px 0;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
    }
    footer {
      margin-top: 40px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      margin-right: 6px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="avatar" aria-hidden="true">JG</div>
      <div class="header-content">
        <h1>Jean Guillon</h1>
        <p>Chief Innovation Officer at Vant Nexus •
