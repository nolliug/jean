<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jean Guillon – Chief Innovation Officer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Jean Guillon is Chief Innovation Officer at Vant Nexus, a leading consultant on ICANN new gTLDs, domain strategy, and innovative namespace projects." />
  <style>
    :root {
      --bg: #ffffff;
      --text: #0b1220;
      --muted: #5b6b7f;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-contrast: #ffffff;
      --card: #f8fafc;
      --border: #e5eef9;
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #f3f7ff 0%, #ffffff 40%);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* Header / Hero */
    .hero {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (min-width: 720px) {
      .hero {
        grid-template-columns: auto 1fr;
        align-items: center;
        padding: 32px;
      }
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(120deg, #1e293b, #0f172a);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 36px;
      border: 4px solid #eef2ff;
      flex-shrink: 0;
      margin: 0 auto;
    }
    @media (min-width: 720px) {
      .avatar { margin: 0; }
    }

    .hero-content h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .hero-content .title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 15px;
    }
    .hero-content .location {
      display: inline-block;
      font-size: 13px;
      color: var(--muted);
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      transition: transform 0.08s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 1px 2px rgba(2, 6, 23, 0.04);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.08);
      text-decoration: none;
    }
    .btn.primary {
      background: var(--accent);
      color: var(--accent-contrast);
      border-color: var(--accent);
    }
    .btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Sections */
    section {
      margin: 28px 0;
    }
    h2 {
      font-size: 20px;
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
    }

      display: inline-block;
      font-size: 12px;
